<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Musikkvideouka · Publikum</title>
    <link rel="stylesheet" href="publikumstyle.css" />
  </head>
  <body>
    <div id="stage">
      <div class="atmosphere" aria-hidden="true">
        <div class="aurora aurora-one"></div>
        <div class="aurora aurora-two"></div>
      </div>
      <h1 id="stage-title">Musikkvideouka</h1>
      <div id="board" aria-label="Resultatliste"></div>
      <section id="winner-overlay" aria-label="Vinner" hidden>
        <div class="winner-rays" aria-hidden="true"></div>
        <div class="winner-halo" aria-hidden="true"></div>
        <div class="winner-content">
          <p id="winner-label" class="winner-label">Vinner</p>
          <div id="winner-portrait" class="winner-portrait"></div>
          <h2 id="winner-name" class="winner-name"></h2>
          <p class="winner-score"><span id="winner-points"></span><span>poeng</span></p>
          <p id="winner-counter" class="winner-counter" hidden></p>
        </div>
        <canvas id="confetti" width="1600" height="900" aria-hidden="true"></canvas>
      </section>
      <div id="pause-overlay" class="stage-overlay" hidden>
        <h2 id="pause-title">Musikkvideouka</h2>
      </div>
      <div id="black-overlay" hidden></div>
    </div>
    <script src="browser-bridge.js"></script>
    <script src="winner.js"></script>
    <script src="publikum.js"></script>
  </body>
</html>
