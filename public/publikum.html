<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Musikkvideouka · Publikum</title>
    <link rel="stylesheet" href="publikumstyle.css" />
  </head>
  <body>
    <div id="stage">
      <div class="atmosphere" aria-hidden="true">
        <div class="aurora aurora-one"></div>
        <div class="aurora aurora-two"></div>
      </div>
      <header class="stage-heading">
        <img class="stage-logo" src="brand/logo.svg" alt="" />
        <h1 id="stage-title">Musikkvideouka</h1>
      </header>
      <div id="board" aria-label="Resultatliste"></div>
      <section id="winner-overlay" aria-label="Vinner" hidden>
        <div class="winner-rays" aria-hidden="true"></div>
        <div class="winner-halo" aria-hidden="true"></div>
        <div class="winner-content">
          <article id="podium-second" class="podium-side" data-place="2" hidden>
            <p class="podium-label">2. plass</p>
            <div class="podium-portrait"></div>
            <h3 class="podium-name"></h3>
            <p class="podium-song"></p>
            <p class="podium-score"><span class="podium-points"></span><span>poeng</span></p>
            <p class="podium-counter" hidden></p>
          </article>
          <article id="winner-main" class="winner-main">
            <p id="winner-label" class="winner-label">Vinner</p>
            <div id="winner-portrait" class="winner-portrait"></div>
            <h2 id="winner-name" class="winner-name"></h2>
            <p id="winner-song" class="winner-song"></p>
            <p class="winner-score"><span id="winner-points"></span><span>poeng</span></p>
            <p id="winner-counter" class="winner-counter" hidden></p>
          </article>
          <article id="podium-third" class="podium-side" data-place="3" hidden>
            <p class="podium-label">3. plass</p>
            <div class="podium-portrait"></div>
            <h3 class="podium-name"></h3>
            <p class="podium-song"></p>
            <p class="podium-score"><span class="podium-points"></span><span>poeng</span></p>
            <p class="podium-counter" hidden></p>
          </article>
        </div>
        <canvas id="confetti" width="1600" height="900" aria-hidden="true"></canvas>
      </section>
      <div id="pause-overlay" class="stage-overlay" hidden>
        <div class="pause-brand">
          <img class="pause-logo" src="brand/logo.svg" alt="" />
          <h2 id="pause-title">Musikkvideouka</h2>
        </div>
      </div>
      <div id="black-overlay" hidden></div>
    </div>
    <button id="audience-fullscreen" class="audience-fullscreen" title="Fullskjerm (F11). Esc avslutter fullskjerm." hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg>
      <span>Fullskjerm</span>
    </button>
    <script src="browser-bridge.js"></script>
    <script src="audience-fullscreen.js"></script>
    <script src="score-format.js"></script>
    <script src="winner.js"></script>
    <script src="publikum.js"></script>
  </body>
</html>
